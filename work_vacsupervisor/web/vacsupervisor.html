<!DOCTYPE html>
<!--
  Vacuum Supervisor - web version of the global vacuum view (GLOBAL.fxml /
  ViewGlobal, shown by work_vacsupervisor and at the bottom right of work_mainpanel).
  The SVG between the GLOBAL SVG markers is generated from GLOBAL.fxml:
      python3 fxml2svg.py --update vacsupervisor.html
  Live values come from jchv (same Tomcat) through vacsupervisor.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virgo Vacuum Supervisor</title>
<style>
  :root {
    --panel-bg: #333333;
    --title-bg: #0e1726;
    --accent: #00e5ff;
    --aqua: #00ffff;
  }
  html, body { margin: 0; height: 100%; background: #000;
               font-family: "DejaVu Sans", "Liberation Sans", "Helvetica", sans-serif; }

  .panel {
    display: flex; flex-direction: column;
    height: 100vh; box-sizing: border-box; padding: 8px;
  }
  .title {
    background: var(--title-bg);
    color: var(--aqua);
    text-align: center;
    font-size: 24px;
    line-height: 42px;
    height: 42px;
    border-radius: 5px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .content {
    background: var(--panel-bg);
    border: 2px solid var(--accent);
    border-radius: 5px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 14px;
  }
  .content > svg { display: block; width: 100%; height: 100%; }
  .jfx { font-family: "DejaVu Sans", "Liberation Sans", "Helvetica", sans-serif; }

  /* --- Connection-error banner (hidden by default) --- */
  .conn-banner {
    position: fixed; left: 50%; top: 8px;
    transform: translateX(-50%);
    background: #ff3339; color: #fff;
    padding: 4px 12px; border-radius: 5px;
    font-size: 14px; font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
  }
  .conn-banner.show { display: block; }
</style>
</head>
<body>

<!-- Shared SVG defs. Inline, zero size, just for url(#id) refs. -->
<svg width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- JavaFX InnerShadow (radius 10, black): blurred-edge mask drawn ON TOP of the shape. -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="black" flood-opacity="0.8"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
</svg>

<div class="panel">
  <div class="title">VACUUM SUPERVISOR</div>
