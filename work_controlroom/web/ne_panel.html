<!DOCTYPE html>
<!--
  SVG port of NESAFETYFLAGS.fxml — proof of concept for a web version of work_controlroom.
  Reproduces the JavaFX panel layout from the FXML coordinates.

  Mapping rules applied:
    - JavaFX layoutX/layoutY    -> outer SVG translate(...)
    - JavaFX scale/rotate pivot -> the node's layout-bounds center, in local coords
      (encoded here as translate(cx,cy) rotate(...) scale(...) translate(-cx,-cy))
    - Rectangle / Label bounds  -> [0,0,prefWidth,prefHeight]; center = (W/2, H/2)
    - SVGPath bounds            -> bbox of the path data (computed by inspection)
    - Circle bounds             -> [-r,-r,2r,2r]; center (0,0), so layoutX/Y is centerX/Y
    - z-order = FXML child order (first child = drawn first / underneath)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>NE Safety Flags — SVG port</title>
<style>
  html, body { margin: 0; padding: 16px; background: #000; color: #d1d1e0; font-family: sans-serif; }
  .label { font-size: 13px; color: #ccc; margin-bottom: 4px; }
  svg.panel { background: #21304F; display: block; border: 2px solid #00e5ff; border-radius: 5px; }
  .jfx-text { font-family: "DejaVu Sans", "Liberation Sans", "Helvetica", sans-serif; }
</style>
</head>
<body>

<div class="label">NESAFETYFLAGS.fxml &rarr; SVG (natural size 407 &times; 425)</div>
<svg class="panel" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 407 425" width="407" height="425">

  <defs>
    <!-- Approximation of JavaFX InnerShadow (default: radius=10, color=black, offset=0). -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic"
                   k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="black" flood-opacity="0.55"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Containment rectangle around the source-green cluster -->
  <rect x="232" y="91" width="59" height="34" rx="5" ry="5"
        fill="none" stroke="#21ff27"/>

  <!-- 2. StatusValveBigNE: layoutX=133 y=169 rotate 90 scale 0.75x2.25; bbox center 35,35 -->
  <g transform="translate(133 169) translate(35 35) rotate(90) scale(0.75 2.25) translate(-35 -35)"
     filter="url(#innerShadow)">
    <path d="M17 26 V 44 L 53 26 V 44 Z" fill="#e1e4db"/>
  </g>

  <!-- 3. StatusValveCryoNE: layoutX=132 y=110 -->
  <g transform="translate(132 110) translate(35 35) rotate(90) scale(0.75 2.25) translate(-35 -35)"
     filter="url(#innerShadow)">
    <path d="M17 26 V 44 L 53 26 V 44 Z" fill="#e1e4db"/>
  </g>

  <!-- 4. Label NE  (33x33 scale 2.25; bbox center 16.5,16.5) -->
  <g transform="translate(150 78) translate(16.5 16.5) scale(2.25) translate(-16.5 -16.5)">
    <rect width="33" height="33" rx="5" ry="5" fill="#e1e4db" filter="url(#innerShadow)"/>
    <text class="jfx-text" x="16.5" y="16.5"
          text-anchor="middle" dominant-baseline="central"
          font-size="12" fill="#000">NE</text>
  </g>

  <!-- 5. Label CryoNE (15x20 rotate 90 scale 2.25; bbox center 7.5,10; no text) -->
  <g transform="translate(160 164) translate(7.5 10) rotate(90) scale(2.25) translate(-7.5 -10)">
    <rect width="15" height="20" fill="#00bfff" filter="url(#innerShadow)"/>
  </g>

  <!-- 6. Label TUBEN (80x21 rotate 90 scale 2.25; bbox center 40,10.5) -->
  <g transform="translate(128 297) translate(40 10.5) rotate(90) scale(2.25) translate(-40 -10.5)">
    <rect width="80" height="21" fill="#e1e4db" filter="url(#innerShadow)"/>
    <text class="jfx-text" x="40" y="10.5"
          text-anchor="middle" dominant-baseline="central"
          font-size="12" fill="#000">NORTH</text>
  </g>

  <!-- 7. NEYag -->
  <circle cx="144" cy="70"  r="9" fill="#ff1f1f"/>

  <!-- 8. NELocalCtrl (12x12 scale 0.75; bbox center 6,6) -->
  <g transform="translate(186 114) translate(6 6) scale(0.75) translate(-6 -6)">
    <rect width="12" height="12" rx="5" ry="5" fill="#ff1f1f"/>
  </g>

  <!-- 9. TUBENYag -->
  <circle cx="155" cy="230" r="9" fill="#ff1f1f"/>

  <!-- 10. NEGreen -->
  <circle cx="144" cy="118" r="9" fill="#21ff27"/>

  <!-- 11. TUBENGreen -->
  <circle cx="181" cy="230" r="9" fill="#21ff27"/>

  <!-- 12. Label NEMini "SNEB" (45x48, font 15, TOP_CENTER alignment) -->
  <g transform="translate(142 9)">
    <rect width="45" height="48" rx="5" ry="5" fill="#e1e4db" filter="url(#innerShadow)"/>
    <text class="jfx-text" x="22.5" y="20"
          text-anchor="middle" font-size="15" fill="#000">SNEB</text>
  </g>

  <!-- 13. NESourceGreen -->
  <circle cx="247" cy="107" r="9" fill="#21ff27"/>

  <!-- 14. NEGreenShutter "pinwheel" (layoutX=211 y=46 scale 0.17; path bbox ~0..123, center ~62,62) -->
  <g transform="translate(211 46) translate(62 62) scale(0.17) translate(-62 -62)">
    <path fill="#21ff27" stroke="#21ff27" stroke-width="2"
          d="M61.72.28a61.18,61.18,0,0,1,38.93,13.91L46.86,45.24V2.1A61.21,61.21,0,0,1,61.72.28ZM106,19.12a61.25,61.25,0,0,1,17.17,42.6,62,62,0,0,1-.64,8.89L69.66,40.09l36.33-21Zm15.06,58.64a61.59,61.59,0,0,1-34.91,40.36V57.6l34.91,20.16ZM79.21,120.64A61.6,61.6,0,0,1,25.05,111L79.21,79.75v40.89Zm-59.8-14.37A61.28,61.28,0,0,1,.28,61.72a62.4,62.4,0,0,1,.65-8.91L55.44,85.46l-36,20.81Zm-17-60.65A61.6,61.6,0,0,1,39.91,4.27l-.44,63.54-37-22.19Z"/>
  </g>

  <!-- 15. NEMiniGreen -->
  <circle cx="176" cy="43" r="9" fill="#21ff27"/>

  <!-- 16. Text "Source Green" (layoutX/Y is baseline anchor for Text) -->
  <text class="jfx-text" x="232" y="79" font-size="16" fill="#d1d1e0">Source Green</text>

  <!-- 17. NEMiniYag -->
  <circle cx="153" cy="43" r="9" fill="#ff1f1f"/>

</svg>

</body>
</html>
