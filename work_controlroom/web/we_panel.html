<!DOCTYPE html>
<!-- SVG port of WESAFETYFLAGS.fxml. Same mapping rules as ne_panel.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>WE Safety Flags — SVG port</title>
<style>
  html, body { margin: 0; padding: 16px; background: #000; color: #d1d1e0; font-family: sans-serif; }
  .label { font-size: 13px; color: #ccc; margin-bottom: 4px; }
  svg.panel { background: #21304F; display: block; border: 2px solid #00e5ff; border-radius: 5px; }
  .jfx-text { font-family: "DejaVu Sans", "Liberation Sans", "Helvetica", sans-serif; }
</style>
</head>
<body>

<div class="label">WESAFETYFLAGS.fxml &rarr; SVG (natural size 446 &times; 324)</div>
<svg class="panel" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 446 324" width="446" height="324">

  <defs>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic"
                   k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="black" flood-opacity="0.55"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- 1. StatusValveBigWE: layoutX=198 y=124 scale 0.75x2.25 (no rotate); bbox center 35,35 -->
  <g transform="translate(198 124) translate(35 35) scale(0.75 2.25) translate(-35 -35)"
     filter="url(#innerShadow)">
    <path d="M17 26 V 44 L 53 26 V 44 Z" fill="#e1e4db"/>
  </g>

  <!-- 2. StatusValveCryoWE: layoutX=136 y=123 scale 0.75x2.25 -->
  <g transform="translate(136 123) translate(35 35) scale(0.75 2.25) translate(-35 -35)"
     filter="url(#innerShadow)">
    <path d="M17 26 V 44 L 53 26 V 44 Z" fill="#e1e4db"/>
  </g>

  <!-- 3. Label WE (33x33 scale 2.25; bbox center 16.5,16.5) -->
  <g transform="translate(103 142) translate(16.5 16.5) scale(2.25) translate(-16.5 -16.5)">
    <rect width="33" height="33" rx="5" ry="5" fill="#e1e4db" filter="url(#innerShadow)"/>
    <text class="jfx-text" x="16.5" y="16.5"
          text-anchor="middle" dominant-baseline="central"
          font-size="12" fill="#000">WE</text>
  </g>

  <!-- 4. Label CryoWE (15x20 scale 2.25; bbox center 7.5,10; no text) -->
  <g transform="translate(195 148) translate(7.5 10) scale(2.25) translate(-7.5 -10)">
    <rect width="15" height="20" fill="#00bfff" filter="url(#innerShadow)"/>
  </g>

  <!-- 5. Label TUBEW (80x21 scale 2.25; bbox center 40,10.5) — horizontal "WEST" -->
  <g transform="translate(297 148) translate(40 10.5) scale(2.25) translate(-40 -10.5)">
    <rect width="80" height="21" fill="#e1e4db" filter="url(#innerShadow)"/>
    <text class="jfx-text" x="40" y="10.5"
          text-anchor="middle" dominant-baseline="central"
          font-size="12" fill="#000">WEST</text>
  </g>

  <!-- 6. WEYag -->
  <circle cx="99" cy="136" r="9" fill="#ff1f1f"/>

  <!-- 7. WELocalCtrl (12x12 scale 0.75; bbox center 6,6) -->
  <g transform="translate(140 180) translate(6 6) scale(0.75) translate(-6 -6)">
    <rect width="12" height="12" rx="5" ry="5" fill="#ff1f1f"/>
  </g>

  <!-- 8. TUBEWYag -->
  <circle cx="261" cy="147" r="9" fill="#ff1f1f"/>

  <!-- 9. WEGreen -->
  <circle cx="99" cy="182" r="9" fill="#21ff27"/>

  <!-- 10. TUBEWGreen -->
  <circle cx="261" cy="170" r="9" fill="#21ff27"/>

  <!-- 11. Label WEMini "SWEB" (48x45, TOP_CENTER, default font ~12pt) -->
  <g transform="translate(34 133)">
    <rect width="48" height="45" rx="5" ry="5" fill="#e1e4db" filter="url(#innerShadow)"/>
    <text class="jfx-text" x="24" y="17"
          text-anchor="middle" font-size="12" fill="#000">SWEB</text>
  </g>

  <!-- 12. WEMiniGreen -->
  <circle cx="69" cy="167" r="9" fill="#21ff27"/>

  <!-- 13. WEMiniYag -->
  <circle cx="45" cy="166" r="9" fill="#ff1f1f"/>

  <!-- 14. Containment rectangle around the source-green cluster -->
  <rect x="177" y="71" width="56" height="32" rx="5" ry="5"
        fill="none" stroke="#21ff27"/>

  <!-- 15. WESourceGreen -->
  <circle cx="192" cy="86" r="9" fill="#21ff27"/>

  <!-- 16. WEGreenShutter pinwheel (scale 0.17; path bbox center ~62,62) -->
  <g transform="translate(155 26) translate(62 62) scale(0.17) translate(-62 -62)">
    <path fill="#21ff27" stroke="#21ff27" stroke-width="2"
          d="M61.72.28a61.18,61.18,0,0,1,38.93,13.91L46.86,45.24V2.1A61.21,61.21,0,0,1,61.72.28ZM106,19.12a61.25,61.25,0,0,1,17.17,42.6,62,62,0,0,1-.64,8.89L69.66,40.09l36.33-21Zm15.06,58.64a61.59,61.59,0,0,1-34.91,40.36V57.6l34.91,20.16ZM79.21,120.64A61.6,61.6,0,0,1,25.05,111L79.21,79.75v40.89Zm-59.8-14.37A61.28,61.28,0,0,1,.28,61.72a62.4,62.4,0,0,1,.65-8.91L55.44,85.46l-36,20.81Zm-17-60.65A61.6,61.6,0,0,1,39.91,4.27l-.44,63.54-37-22.19Z"/>
  </g>

  <!-- 17. "Source Green" label (layoutY = baseline) -->
  <text class="jfx-text" x="155" y="54" font-size="16" fill="#d1d1e0">Source Green</text>

  <!-- 18. Containment rectangle around the Source PCAL cluster -->
  <rect x="22" y="98" width="59" height="34" rx="5" ry="5"
        fill="none" stroke="#ff7e21"/>

  <!-- 19. WESourcePCAL (1047 Hz photon calibrator; orange = on, grey = off) -->
  <circle cx="51" cy="115" r="9" fill="#ff7e21"/>

  <!-- 20. Text "Source PCAL" (layoutY = baseline) -->
  <text class="jfx-text" x="14" y="86" font-size="16" fill="#d1d1e0">Source PCAL</text>

  <!-- 21. WEPCAL (tower dot — mirrors the source, same channel) -->
  <circle cx="142" cy="135" r="9" fill="#ff7e21"/>

</svg>

</body>
</html>
