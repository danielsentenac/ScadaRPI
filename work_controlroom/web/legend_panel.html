<!DOCTYPE html>
<!-- SVG port of SAFETYFLAGSLEGEND.fxml. Same mapping rules as the other panels. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safety Flags Legend — SVG port</title>
<style>
  html, body { margin: 0; padding: 16px; background: #000; color: #d1d1e0; font-family: sans-serif; }
  .label { font-size: 13px; color: #ccc; margin-bottom: 4px; }
  svg.panel { background: #21304F; display: block; border: 2px solid #00e5ff; border-radius: 5px; }
  .jfx-text { font-family: "DejaVu Sans", "Liberation Sans", "Helvetica", sans-serif; }
</style>
</head>
<body>

<div class="label">SAFETYFLAGSLEGEND.fxml &rarr; SVG (natural 856 &times; 175; FXML prefHeight 152 but content extends to ~170)</div>
<svg class="panel" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 856 175" width="856" height="175">

  <defs>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic"
                   k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="black" flood-opacity="0.55"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
    <symbol id="pinwheel" overflow="visible">
      <path d="M61.72.28a61.18,61.18,0,0,1,38.93,13.91L46.86,45.24V2.1A61.21,61.21,0,0,1,61.72.28ZM106,19.12a61.25,61.25,0,0,1,17.17,42.6,62,62,0,0,1-.64,8.89L69.66,40.09l36.33-21Zm15.06,58.64a61.59,61.59,0,0,1-34.91,40.36V57.6l34.91,20.16ZM79.21,120.64A61.6,61.6,0,0,1,25.05,111L79.21,79.75v40.89Zm-59.8-14.37A61.28,61.28,0,0,1,.28,61.72a62.4,62.4,0,0,1,.65-8.91L55.44,85.46l-36,20.81Zm-17-60.65A61.6,61.6,0,0,1,39.91,4.27l-.44,63.54-37-22.19Z"/>
    </symbol>
    <symbol id="valve" overflow="visible">
      <path d="M17 26 V 44 L 53 26 V 44 Z"/>
    </symbol>
  </defs>

  <!-- Column 1: Valve Open/Close, Yag On/Off, Yag Shutter Open/Close -->
  <g transform="translate(-5 -3) translate(35 35) scale(0.8) translate(-35 -35)" filter="url(#innerShadow)" fill="#ff9933"><use href="#valve"/></g>
  <text class="jfx-text" x="62" y="37" font-size="16" fill="#d1d1e0">Valve Open</text>
  <g transform="translate(-5 23) translate(35 35) scale(0.8) translate(-35 -35)" filter="url(#innerShadow)" fill="#33ff57"><use href="#valve"/></g>
  <text class="jfx-text" x="62" y="63" font-size="16" fill="#d1d1e0">Valve Close</text>

  <circle cx="30" cy="84"  r="10" fill="#ff1f1f"/>
  <text class="jfx-text" x="62" y="89" font-size="16" fill="#d1d1e0">Yag On</text>
  <circle cx="30" cy="110" r="10" fill="#4e514e" stroke="#ff1f1f"/>
  <text class="jfx-text" x="62" y="115" font-size="16" fill="#d1d1e0">Yag Off</text>

  <!-- Yag shutter (red) -->
  <g transform="translate(-31.5 76.5) translate(62 62) scale(0.18) translate(-62 -62)"
     fill="#ff1f1f" stroke="#ff1f1f" stroke-width="2"><use href="#pinwheel"/></g>
  <text class="jfx-text" x="62" y="142" font-size="16" fill="#d1d1e0">Shutter Open</text>
  <g transform="translate(-31.5 102.5) translate(62 62) scale(0.18) translate(-62 -62)"
     fill="#4e514e" stroke="#ff1f1f" stroke-width="2"><use href="#pinwheel"/></g>
  <text class="jfx-text" x="62" y="168" font-size="16" fill="#d1d1e0">Shutter Close</text>

  <!-- Column 2: Green On/Off, Green Shutter -->
  <circle cx="240" cy="32" r="10" fill="#21ff27"/>
  <text class="jfx-text" x="272" y="37" font-size="16" fill="#d1d1e0">Green On</text>
  <circle cx="240" cy="58" r="10" fill="#4e514e" stroke="#21ff27"/>
  <text class="jfx-text" x="272" y="63" font-size="16" fill="#d1d1e0">Green Off</text>

  <g transform="translate(178.5 23.5) translate(62 62) scale(0.18) translate(-62 -62)"
     fill="#21ff27" stroke="#21ff27" stroke-width="2"><use href="#pinwheel"/></g>
  <text class="jfx-text" x="272" y="89" font-size="16" fill="#d1d1e0">Shutter Open</text>
  <g transform="translate(178.5 49.5) translate(62 62) scale(0.18) translate(-62 -62)"
     fill="#4e514e" stroke="#21ff27" stroke-width="2"><use href="#pinwheel"/></g>
  <text class="jfx-text" x="272" y="115" font-size="16" fill="#d1d1e0">Shutter Close</text>

  <!-- Column 3: CO2 On/Off, CO2 Shutter -->
  <circle cx="450" cy="32" r="10" fill="#efff21"/>
  <text class="jfx-text" x="482" y="37" font-size="16" fill="#d1d1e0">CO₂ On</text>
  <circle cx="450" cy="58" r="10" fill="#4e514e" stroke="#efff21"/>
  <text class="jfx-text" x="482" y="63" font-size="16" fill="#d1d1e0">CO₂ Off</text>

  <g transform="translate(388.5 23.5) translate(62 62) scale(0.18) translate(-62 -62)"
     fill="#efff21" stroke="#efff21" stroke-width="2"><use href="#pinwheel"/></g>
  <text class="jfx-text" x="482" y="89" font-size="16" fill="#d1d1e0">Shutter Open</text>
  <g transform="translate(388.5 49.5) translate(62 62) scale(0.18) translate(-62 -62)"
     fill="#4e514e" stroke="#efff21" stroke-width="2"><use href="#pinwheel"/></g>
  <text class="jfx-text" x="482" y="115" font-size="16" fill="#d1d1e0">Shutter Close</text>

  <!-- F0+F7 Current On/Off (14x14 red square) -->
  <rect x="443" y="130" width="14" height="14" rx="5" ry="5" fill="#ff1f1f"/>
  <text class="jfx-text" x="482" y="142" font-size="16" fill="#d1d1e0">F0+F7 Current On</text>
  <rect x="443" y="156" width="14" height="14" rx="5" ry="5" fill="#4e514e" stroke="#ff1f1f"/>
  <text class="jfx-text" x="482" y="168" font-size="16" fill="#d1d1e0">F0+F7 Current Off</text>

  <!-- Column 5: Sensor O2 Alarms -->
  <circle cx="660" cy="31"  r="8" fill="yellow"/>
  <text class="jfx-text" x="692" y="37" font-size="16" fill="#d1d1e0">Sensor O₂ Alarm 1</text>
  <circle cx="660" cy="59"  r="8" fill="#ff7f00"/>
  <text class="jfx-text" x="692" y="65" font-size="16" fill="#d1d1e0">Sensor O₂ Alarm 2</text>
  <circle cx="660" cy="87"  r="8" fill="red"/>
  <text class="jfx-text" x="692" y="93" font-size="16" fill="#d1d1e0">Sensor O₂ Alarm 3</text>
  <circle cx="660" cy="115" r="8" fill="#d1d1e0"/>
  <text class="jfx-text" x="692" y="121" font-size="16" fill="#d1d1e0">Sensor O₂ Off</text>
  <circle cx="660" cy="143" r="8" fill="#ff7f7f"/>
  <text class="jfx-text" x="692" y="149" font-size="16" fill="#d1d1e0">Sensor O₂ Reset</text>

</svg>

</body>
</html>
